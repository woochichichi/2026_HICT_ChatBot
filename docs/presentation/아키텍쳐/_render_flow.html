<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .page{width:1360px;padding:26px 30px 22px;font-family:"Malgun Gothic","Noto Sans KR",-apple-system,sans-serif;}
  .hd{display:flex;align-items:baseline;gap:12px;margin-bottom:4px;}

  .cap{font-size:13.5px;color:#334155;margin:6px 0 14px;}
  .cap b{color:#D85C12;}
  .legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:12.5px;color:#64748B;}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
  .n-title{font:800 13.5px "Malgun Gothic",sans-serif;}
  .n-sub{font:600 10.5px "Malgun Gothic",sans-serif;fill:#64748B;}
  .lane-label{font:800 13px "Malgun Gothic",sans-serif;}
  .lane-tag{font:800 10px "Malgun Gothic",sans-serif;fill:#fff;}
  .edge-strong{stroke:#F37321;stroke-width:2.5;fill:none;}
  .rw{font:800 10px "Malgun Gothic",sans-serif;fill:#7C3AED;}
