<!DOCTYPE html>

<style>

  .hd{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;}

  .n-sub{font:600 11px "Malgun Gothic",sans-serif;fill:#64748B;}
  .grp-label{font:800 11.5px "Malgun Gothic",sans-serif;letter-spacing:.04em;}
  .edge{stroke:#94A3B8;stroke-width:2;fill:none;}
  .edge-strong{stroke:#F37321;stroke-width:2.5;fill:none;}
  .edge-dash{stroke:#94A3B8;stroke-width:2;fill:none;stroke-dasharray:5 5;}
  .elabel{font:700 10.5px "Malgun Gothic",sans-serif;fill:#64748B;}
